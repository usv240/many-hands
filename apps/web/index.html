    <title>Many Hands: fair match intelligence</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved or system theme before first paint, so there is no flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem("mh-theme") || "system";
          var dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <h1>Many Hands: nobody concedes alone</h1>
      <p>Microsoft Foundry agents trace every goal back through every player who contributed to it, catch scapegoating lines before they air, and have a fair line ready about 3 seconds after the goal.</p>
      <p>A pundit is about to say: "Number 8's howler cost them the goal." Unfair. Many Hands puts on air: "A loose clearance by number 8 and a misplaced pass from number 9 led to Rafe Quilian's goal." Fair.</p>
      <p>This site needs JavaScript. The code, results and a three-minute judge's path are at https://github.com/usv240/many-hands. API health: /v1/health. Live timings: /v1/metrics.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
