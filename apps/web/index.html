<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Many Hands traces every goal back through every player who caused it, checks each broadcast line for scapegoating, and rewrites it fairly before it airs." />
    <meta name="color-scheme" content="light dark" />
    <title>Many Hands: fair match intelligence</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved or system theme before first paint, so there is no flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem("mh-theme") || "system";
          var dark = saved === "dark" || (saved === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
