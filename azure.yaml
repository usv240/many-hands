# Azure Developer CLI project. `azd up` provisions everything in infra/ and deploys the services.
name: many-hands
metadata:
  template: many-hands@0.1.0
infra:
  provider: bicep
  path: infra
services:
  app:
    project: .
    language: docker
    host: containerapp
    docker:
      path: ./Dockerfile
      remoteBuild: false
