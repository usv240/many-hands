name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Lint
        run: uv run ruff check packages services tests
      - name: Unit, property and API tests
        run: uv run pytest -q

  web:
    name: Website (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Parity with the Python engine, and ledger tests
        run: npx vitest run
      - name: Type-check and build
        run: npm run build
